    ctx.roundRect(cx - hw - 2, HOP.topY - 2, HOP.topW * 0.55, 4, 2);
    ctx.fill();

    /* chunky gold exit band with bolt heads */
    ctx.beginPath();
    ctx.roundRect(cx - nw - 8, HOP.exitY - 10, HOP.neckW + 16, 13, 5);
    ctx.fillStyle = '#C8A84B';
    ctx.fill();
    ctx.strokeStyle = '#5A3A1A';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    for (const bx of [cx - nw - 1, cx + nw + 1]) {
      ctx.fillStyle = '#F0D078';
      ctx.beginPath(); ctx.arc(bx, HOP.exitY - 3.5, 3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#5A3A1A'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    /* big friendly rivets on the bell */
    for (const [rx, ry] of [[cx - nw + 10, (HOP.neckY + HOP.exitY) / 2], [cx + nw - 10, (HOP.neckY + HOP.exitY) / 2]]) {
      ctx.fillStyle = '#F0D078';
      ctx.beginPath(); ctx.arc(rx, ry, 3.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#2E4A38'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    ctx.restore();

    /* drip: idle goo tease at the nozzle when queue is loading */
    if (feedQueue.length) {
      const next = feedQueue[0];
      const ph = (Math.sin(t * 6) + 1) / 2;
      ctx.fillStyle = next.color;
      ctx.beginPath();
      ctx.ellipse(HOP.cx, HOP.exitY + 3 + ph * 5, 12 + ph * 4, 8 + ph * 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPiston(side, t) {
    const faceX = side === 'L' ? press.faceL : press.faceR;
    const dir = side === 'L' ? 1 : -1;
    const plateX = side === 'L' ? faceX - PLATE_W : faceX;
    const edgeX = side === 'L' ? 0 : W;
    const midY = (PLATE_TOP + FLOOR) / 2;
    const pressing = isPressing();

    /* telescoping main ram + twin guide rods — cartoon cylinders:
       lit from above, fat ink outline, running shine */
    const INK = '#3E2216';
    const armLen = Math.abs(faceX - edgeX);
    const armX = side === 'L' ? 0 : faceX;
    const cyl = (x, y, w, h, base, r) => {
      if (w < 2) return;
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, shade(base, 1.28));
      g.addColorStop(0.45, base);
      g.addColorStop(1, shade(base, 0.6));
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2.4;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,250,235,0.35)';
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 3, Math.max(w - 8, 3), Math.max(h * 0.14, 3), 2);
      ctx.fill();
    };
    cyl(armX - 6, midY - 26, armLen + 6, 52, '#7A4A2A', 5);
    cyl(side === 'L' ? -6 : faceX + armLen * 0.45, midY - 15, armLen * 0.55 + 6, 30, '#96603A', 5);
    for (const ry of [PLATE_TOP + 34, FLOOR - 48]) cyl(armX - 6, ry, armLen + 6, 14, '#6E4224', 4);

    /* wall mount flange with bolt heads */
    cyl(side === 'L' ? -8 : W - 14, PLATE_TOP + 8, 22, FLOOR - PLATE_TOP - 16, '#8A5430', 5);
    const fbx = side === 'L' ? 9 : W - 9;
    for (const fy of [PLATE_TOP + 30, midY, FLOOR - 34]) {
      ctx.fillStyle = '#F0D078';
      ctx.beginPath(); ctx.arc(fbx, fy, 3, 0, 7); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    }

    /* plate body */
    const plateH = FLOOR - PLATE_TOP;
    const pg = ctx.createLinearGradient(plateX, 0, plateX + PLATE_W, 0);
    if (side === 'L') { pg.addColorStop(0, shade('#A05A36', 1.18)); pg.addColorStop(1, shade('#A05A36', 0.66)); }
    else { pg.addColorStop(0, shade('#A05A36', 0.66)); pg.addColorStop(1, shade('#A05A36', 1.18)); }
    ctx.beginPath();
    ctx.roundRect(plateX - 1, PLATE_TOP - 2, PLATE_W + 2, plateH + 2, 4);
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.6;
    ctx.stroke();

    /* hazard stripes on the pressing face */
    const fx = side === 'L' ? faceX - 6 : faceX;
    ctx.save();
    ctx.beginPath();
    ctx.rect(fx, PLATE_TOP, 6, FLOOR - PLATE_TOP);
    ctx.clip();
    ctx.fillStyle = '#FFD23F';
    ctx.fillRect(fx, PLATE_TOP, 6, FLOOR - PLATE_TOP);
    ctx.fillStyle = '#1A0606';
    for (let y = PLATE_TOP - 12; y < FLOOR; y += 16) {
      ctx.beginPath();
      ctx.moveTo(fx, y + 8); ctx.lineTo(fx + 6, y); ctx.lineTo(fx + 6, y + 8); ctx.lineTo(fx, y + 16);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    /* bolt heads down the plate spine */
    const bx = plateX + (side === 'L' ? 6 : PLATE_W - 6);
    for (const by of [PLATE_TOP + 16, midY, FLOOR - 22]) {
      ctx.fillStyle = '#F0D078';
      ctx.beginPath(); ctx.arc(bx, by, 3.2, 0, 7); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(bx - 1, by - 1, 1, 0, 7); ctx.fill();
    }

    /* pressure gauge riding the top of each plate */
    if (pressing || press.state === 'release') {
      const gx = plateX + PLATE_W / 2, gy = PLATE_TOP - 22;
      const drivePos = 1 - (press.faceR - press.faceL - press.gapTarget) / (WALL_R - WALL_L - press.gapTarget || 1);
      const p = press.state === 'hold' ? 1 : press.state === 'release' ? Math.max(0, 1 - press.t * 1.4) : Math.max(0, Math.min(1, drivePos));
      ctx.fillStyle = '#5A3A1A';
      ctx.beginPath(); ctx.arc(gx, gy, 14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#C8A84B'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(gx, gy, 15.6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#FFF2D8';
      ctx.beginPath(); ctx.arc(gx, gy, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.beginPath(); ctx.ellipse(gx - 4, gy - 5, 3, 1.8, -0.6, 0, Math.PI * 2); ctx.fill();
      /* red zone */
      ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(gx, gy, 8, -0.9, 0.5); ctx.stroke();
      /* needle sweeps into the red as pressure builds */
      const ang = -Math.PI * 0.95 + p * (Math.PI * 1.15) + (press.state === 'hold' && !reduceMotion ? Math.sin(t * 40) * 0.1 : 0);
      ctx.strokeStyle = '#1A0606'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + Math.cos(ang) * 8.5, gy + Math.sin(ang) * 8.5);
      ctx.stroke();
    }
  }

  function drawParticles(dt) {
    for (const p of particles) {
      p.vy += 1300 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > FLOOR - p.r) { p.y = FLOOR - p.r; p.vy *= -0.4; p.vx *= 0.7; }
      p.life -= dt * 1.4;
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + p.life * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
  }

  function drawGlass() {
    /* soft vignette so the cave feels deep */
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.5, H * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(46,24,6,0.22)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  /* ── main loop ── */
  let last = performance.now();
  let simTime = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    simTime += dt;

    /* feed queue → spit blobs one at a time */
    feedTimer -= dt;
    if (feedQueue.length && feedTimer <= 0) {
      spitBlob(feedQueue.shift());
      feedTimer = 0.42;
    }
    tubeSquish = Math.max(0, tubeSquish - dt * 4);

    if (isPressing()) updatePress(dt);

    /* the user's hand: spring the grabbed blob toward the pointer */
    if (grab) {
      const b = grab.blob;
      if (!blobs.includes(b)) grab = null;
      else {
        const c = b.center();
        let dx = (mouse.x - grab.offx) - c.x;
        let dy = (mouse.y - grab.offy) - c.y;
        const mag = Math.hypot(dx, dy);
        const cap = 60;                     // the goo lags behind a fast hand
        if (mag > cap) { dx *= cap / mag; dy *= cap / mag; }
        for (const n of b.nodes) {
          n.x += dx * 0.4;  n.y += dy * 0.4;
          n.px += dx * 0.34; n.py += dy * 0.34;   // damp so it doesn't slingshot
        }
      }
    }

    /* physics substeps */
    const SUB = 3;
    const sdt = dt / SUB;
    lastSdt = sdt;
    for (let s = 0; s < SUB; s++) {
      for (const b of blobs) b.integrate(sdt);
      for (let it = 0; it < 3; it++) {
        for (const b of blobs) b.constrain();
        collideBlobs();
      }
    }

    /* hover pick (topmost = last drawn) */
    hoverBlob = grab ? grab.blob : null;
    if (!hoverBlob && mouse.x >= 0) {
      for (let i = blobs.length - 1; i >= 0; i--) {
        if (blobs[i].contains(mouse.x, mouse.y)) { hoverBlob = blobs[i]; break; }
      }
    }
    canvas.style.cursor = grab ? 'grabbing' : (hoverBlob ? 'grab' : 'default');

    /* draw */
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.save();
    if (shake > 0.2) {
      ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
      shake *= Math.pow(0.001, dt); // fast decay
    } else shake = 0;

    drawChamber();
    blobs.forEach(b => {
      const idx = b.entry ? files.findIndex(f => f.id === b.entry.id) : -1;
      b.draw(simTime, b === hoverBlob, idx);
    });
    drawPiston('L', simTime);
    drawPiston('R', simTime);
    drawFeedPipe();
    drawHopper(simTime);
    drawParticles(dt);
    drawGlass();

    if (flash > 0.02) {
      ctx.globalAlpha = flash;
      ctx.fillStyle = '#FFF6DC';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      flash *= Math.pow(0.0001, dt);
    }
    ctx.restore();

    updateTip();
    requestAnimationFrame(frame);
  }

  /* hover tooltip (HTML overlay so long filenames wrap nicely) */
  function updateTip() {
    const tip = $('blobTip');
    if (!hoverBlob) { tip.classList.remove('show'); return; }
    const rect = canvas.getBoundingClientRect();
    const sx = rect.width / W, sy = rect.height / H;
    if (hoverBlob.segments) {
      const m = hoverBlob.mergedInfo;
      tip.innerHTML = `<span class="tip-label">Pressed &amp; merged</span>` +
        `<span class="tip-name">${esc(m.name)}</span>` +
        `<span class="tip-meta">${m.pages} page${m.pages !== 1 ? 's' : ''} &middot; ${files.length} documents</span>`;
    } else {
      const e = hoverBlob.entry;
      const idx = files.findIndex(f => f.id === e.id);
      const pages = e.pages == null ? '&hellip;' : (e.pages === '?' ? '? pages' : e.pages + (e.pages === 1 ? ' page' : ' pages'));
      tip.innerHTML = `<span class="tip-label">Doc ${idx + 1} of ${files.length}</span>` +
        `<span class="tip-name">${esc(e.name)}</span>` +
        `<span class="tip-meta">${fmtSize(e.size)} &middot; ${pages}</span>`;
    }
    const c = hoverBlob.center();
    let left = c.x * sx + 18, top = c.y * sy - 14;
    tip.style.left = Math.min(left, rect.width - 250) + 'px';
    tip.style.top = Math.max(6, top) + 'px';
    tip.classList.add('show');
  }

  /* ── canvas sizing + input ── */
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.width * (H / W) * dpr);
    canvas.style.height = (rect.width * H / W) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function updateMouse(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) / rect.width * W;
    mouse.y = (e.clientY - rect.top) / rect.height * H;
  }

  function releaseGrab() {
    if (!grab) return;
    const b = grab.blob;
    if (blobs.includes(b)) {
      /* throw: velocity from the last ~130ms of pointer motion */
      const now = performance.now();
      const h = grab.hist.filter(p => now - p.t < 130);
      if (h.length >= 2) {
        const a = h[0], z = h[h.length - 1];
        const span = Math.max((z.t - a.t) / 1000, 0.016);
        let vx = (z.x - a.x) / span, vy = (z.y - a.y) / span;
        const sp = Math.hypot(vx, vy), CAP = 1500;
        if (sp > CAP) { vx *= CAP / sp; vy *= CAP / sp; }
        for (const n of b.nodes) { n.px = n.x - vx * lastSdt; n.py = n.y - vy * lastSdt; }
      }
      /* a quick tap without movement is just a poke */
      if (now - grab.t0 < 220 && !grab.moved) b.impulse(4);
    }
    grab = null;
  }

  canvas.addEventListener('pointerdown', e => {
    updateMouse(e);
    if (isPressing() && press.state !== 'release') return;  // hands off mid-squeeze
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      const c = b.center();
      if (b.contains(mouse.x, mouse.y) || Math.hypot(mouse.x - c.x, mouse.y - c.y) < b.r * 0.9) {
        grab = {
          blob: b,
          offx: mouse.x - c.x, offy: mouse.y - c.y,
          hist: [{ x: mouse.x, y: mouse.y, t: performance.now() }],
          moved: false, t0: performance.now()
        };
        try { canvas.setPointerCapture(e.pointerId); } catch {}
        e.preventDefault();
        break;
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    updateMouse(e);
    if (grab) {
      const h = grab.hist;
      const last = h[h.length - 1];
      if (Math.hypot(mouse.x - h[0].x, mouse.y - h[0].y) > 6) grab.moved = true;
      if (performance.now() - last.t > 12) {
        h.push({ x: mouse.x, y: mouse.y, t: performance.now() });
        if (h.length > 10) h.shift();
      }
    } else if (hoverBlob && !hoverBlob._wobbled) {
      hoverBlob.impulse(1.4);
      hoverBlob._wobbled = true;
      setTimeout(() => { if (hoverBlob) hoverBlob._wobbled = false; }, 400);
    }
  });

  canvas.addEventListener('pointerup', releaseGrab);
  canvas.addEventListener('pointercancel', releaseGrab);
  canvas.addEventListener('pointerleave', () => { if (!grab) { mouse.x = -1; mouse.y = -1; } });

  requestAnimationFrame(t => { last = t; frame(t); });

  return {
    feed, pop, clear, fuse, unfuse, isPressing, abortPress,
    press: pressAction,
    hasBlobs: () => blobs.length > 0,
    /* test/debug introspection: blob bounds in canvas coordinates */
    _debug: () => blobs.map(b => {
      const bb = b.bbox(), c = b.center();
      return { ...bb, cx: c.x, cy: c.y, merged: !!b.segments };
    })
  };
})();

/* ═══════════════════════════════════════════════════════════════
   DOWNLOAD-BUTTON GOO — a glass tank holding one slice of goo per
   pressed document, in the same colors as their blobs. Calm ripples
   at rest; hovering turns up the heat and it boils.
   ═══════════════════════════════════════════════════════════════ */
const dlGoo = (() => {
  const btn = $('dlBtn');
  const cvs = document.createElement('canvas');
  cvs.id = 'dlGooCvs';
  btn.prepend(cvs);
  const g2 = cvs.getContext('2d');
  let raf = null, W = 0, H = 0, n = 0, tPrev = 0;
  let h, v, colors = [], bubbles = [], swirls = [], hover = false, churn = 0;

  btn.addEventListener('mouseenter', () => { hover = true; });
  btn.addEventListener('mouseleave', () => { hover = false; });
  btn.addEventListener('pointerdown', () => { hover = true; setTimeout(() => hover = false, 900); });

  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = btn.getBoundingClientRect();
    W = r.width; H = r.height;
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    n = Math.max(24, Math.round(W / 4));
    h = new Float32Array(n).fill(H * 0.66);   // a generous pour
    v = new Float32Array(n);
    bubbles = [];
    /* two swirl-blobs of goo per document, anchored near their slice */
    swirls = [];
    const m = colors.length || 1;
    colors.forEach((c, k) => {
      for (let s = 0; s < 2; s++) {
        swirls.push({
          c,
          ax: W * (k + 0.5) / m + (Math.random() - 0.5) * 30,
          ay: H * 0.75 + (Math.random() - 0.5) * 14,
          ampX: 14 + Math.random() * 22,
          ampY: 5 + Math.random() * 9,
          sp: 0.4 + Math.random() * 0.5,
          ph: Math.random() * 6.28,
          r: H * (0.45 + Math.random() * 0.3)
        });
      }
    });
  }

  function frame(t) {
    tPrev = t;
    /* surface waves: neighbor springs, viscous damping */
    for (let i = 0; i < n; i++) {
      const l = i > 0 ? h[i - 1] : h[i], r = i < n - 1 ? h[i + 1] : h[i];
      v[i] = (v[i] + ((l + r) / 2 - h[i]) * 0.4) * 0.93;
    }
    let sum = 0;
    for (let i = 0; i < n; i++) {
      h[i] += v[i];
      if (h[i] > H - 8) { h[i] = H - 8; v[i] *= -0.3; }
      else if (h[i] < 6) { h[i] = 6; v[i] *= -0.3; }
      sum += h[i];
    }
    /* goo is conserved: clamps must never drain the tank */
    const topUp = (n * H * 0.66 - sum) / n;
    for (let i = 0; i < n; i++) h[i] += topUp;
    /* heat: gentle at rest, rolling boil on hover */
    if (!reduceMotion && Math.random() < (hover ? 0.9 : 0.05)) {
      v[(Math.random() * n) | 0] += (Math.random() - 0.5) * (hover ? 4.5 : 1.1);
    }
    if (!reduceMotion && Math.random() < (hover ? 0.55 : 0.012)) {
      bubbles.push({ x: 4 + Math.random() * (W - 8), y: H - 3, r: 1.5 + Math.random() * 2.8, vy: 0.5 + Math.random() });
    }

    g2.clearRect(0, 0, W, H);
    const tt = t / 1000;
    churn += ((hover ? 1 : 0) - churn) * 0.05;   // heat eases in and out

    /* the liquid body: all document colors blended across the width */
    const grad = g2.createLinearGradient(0, 0, W, 0);
    const m = colors.length || 1;
    colors.forEach((c, k) => grad.addColorStop(m === 1 ? 0.5 : k / (m - 1), c));
    if (!colors.length) grad.addColorStop(0.5, '#6BE675');
    g2.globalAlpha = 0.95;
    g2.beginPath();
    g2.moveTo(0, H);
    for (let i = 0; i < n; i++) g2.lineTo((i / (n - 1)) * W, H - h[i]);
    g2.lineTo(W, H);
    g2.closePath();
    g2.fillStyle = grad;
    g2.fill();
    g2.globalAlpha = 1;

    /* swirling color clouds INSIDE the liquid — hover churns the mix */
    g2.globalCompositeOperation = 'source-atop';
    for (const s of swirls) {
      const speed = s.sp * (1 + churn * 3.5);
      const x = s.ax + Math.cos(tt * speed * 2 + s.ph) * s.ampX * (1 + churn * 1.6);
      const y = s.ay + Math.sin(tt * speed * 3.1 + s.ph * 2) * s.ampY * (1 + churn * 1.8);
      if (churn > 0.05) {           /* stirring makes anchors wander → real mixing */
        s.ax += (Math.random() - 0.5) * churn * 1.6;
        s.ax = Math.max(10, Math.min(W - 10, s.ax));
      }
      const rg = g2.createRadialGradient(x, y, 0, x, y, s.r);
      rg.addColorStop(0, s.c);
      rg.addColorStop(0.65, s.c + '59');
      rg.addColorStop(1, s.c + '00');
      g2.fillStyle = rg;
      g2.beginPath(); g2.arc(x, y, s.r, 0, 7); g2.fill();
    }
    /* bubbles rise and pop with a little splash kick */
    bubbles = bubbles.filter(b => {
      b.y -= b.vy * (hover ? 1.7 : 1);
      const i = Math.max(0, Math.min(n - 1, Math.round((b.x / W) * (n - 1))));
      if (b.y <= H - h[i] + b.r) { v[i] -= 1.7; return false; }
      g2.fillStyle = 'rgba(255,255,255,0.55)';
      g2.beginPath(); g2.arc(b.x, b.y, b.r, 0, 7); g2.fill();
      return true;
    });
    g2.globalCompositeOperation = 'source-over';
    /* meniscus */
    g2.strokeStyle = 'rgba(255,255,255,0.8)';
    g2.lineWidth = 2.5;
    g2.lineCap = 'round';
    g2.beginPath();
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * W, y = H - h[i];
      i ? g2.lineTo(x, y) : g2.moveTo(x, y);
    }
    g2.stroke();
    /* glass streak */
    g2.fillStyle = 'rgba(255,255,255,0.15)';
    g2.beginPath();
    g2.moveTo(W * 0.07, 0); g2.lineTo(W * 0.19, 0); g2.lineTo(W * 0.11, H); g2.lineTo(W * -0.01, H);
    g2.closePath();
    g2.fill();

    if (!reduceMotion) raf = requestAnimationFrame(frame);
  }

  return {
    start(cols) {
      colors = cols;
      cancelAnimationFrame(raf);
      requestAnimationFrame(t0 => { build(); frame(t0); });
    },
    stop() { cancelAnimationFrame(raf); }
  };
})();

/* ═══════════════════════════════════════════════════════════════
   CONVEYOR — dropped PDFs travel a pipe from the dropbox straight
   into the machine's hopper. The story writes itself.
   ═══════════════════════════════════════════════════════════════ */
const conveyor = (() => {
  const svg = $('connector');
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };
  /* cylinder illusion: shadow → dark rim → body → lit core → glass shine */
  const shadow  = mk('path', { fill: 'none', stroke: 'rgba(9,30,74,0.16)', 'stroke-width': 33, 'stroke-linecap': 'round' });
  const outline = mk('path', { fill: 'none', stroke: '#24382C', 'stroke-width': 30, 'stroke-linecap': 'round' });
  const body    = mk('path', { fill: 'none', stroke: '#7E9C86', 'stroke-width': 23, 'stroke-linecap': 'round' });
  const core    = mk('path', { fill: 'none', stroke: '#A9C2AC', 'stroke-width': 12, 'stroke-linecap': 'round' });
  const shine   = mk('path', { fill: 'none', stroke: 'rgba(255,255,255,0.5)', 'stroke-width': 4.5, 'stroke-linecap': 'round' });
  const collarA = mk('rect', { fill: '#C8A84B', stroke: '#5A3A1A', 'stroke-width': 2, width: 38, height: 13, rx: 3 });
  const fittings = mk('g', {});
  /* the hopper's rim lip, standing proud of the box top for depth */
  const crown = mk('rect', { fill: '#5E7A66', stroke: '#2E4A38', 'stroke-width': 4, rx: 8, height: 17 });
  const crownHi = mk('rect', { fill: 'rgba(255,255,255,0.35)', rx: 2, height: 4 });
  svg.append(shadow, outline, body, core, shine, fittings, collarA, crown, crownHi);
  let len = 0, ready = false;

  /* ── THE SWAN-NECK LIFT ───────────────────────────────────────────
     One hand-drawn route, all tangent arcs, no sharp cuts:
     it drops out of the BOTTOM of the dropbox, U-turns upward, rises
     through the gutter between the two cards, crests in the band under
     the title, and plunges straight down into the TOP of the press.  */
  function layout() {
    if (window.innerWidth <= 880) { svg.style.display = 'none'; ready = false; return; }
    svg.style.display = 'block';
    const wb = $('main').getBoundingClientRect();
    const dz = $('dz').getBoundingClientRect();
    const mc = $('machine').getBoundingClientRect();
    const R = 34;
    const side = document.querySelector('.side').getBoundingClientRect();
    const gutterX = ((mc.right - wb.left) + (dz.left - wb.left)) / 2;
    const sx = dz.left - wb.left + dz.width * 0.5;    // exit at the dropbox floor, center
    const sy = dz.bottom - wb.top - 2;
    const ex = mc.left - wb.left + mc.width * 0.5;    // dead-aligned with the funnel below
    const ey = mc.top - wb.top + 30;
    const topY = mc.top - wb.top - 26;                // crest, in the band under the title
    const dip = side.bottom - wb.top + 38;            // hook under the whole right column
    const d =
      `M ${sx} ${sy}` +
      ` L ${sx} ${dip - R}` +
      ` A ${R} ${R} 0 0 1 ${sx - R} ${dip}` +
      ` L ${gutterX + R} ${dip}` +
      ` A ${R} ${R} 0 0 1 ${gutterX} ${dip - R}` +
      ` L ${gutterX} ${topY + R}` +
      ` A ${R} ${R} 0 0 0 ${gutterX - R} ${topY}` +
      ` L ${ex + R} ${topY}` +
      ` A ${R} ${R} 0 0 0 ${ex} ${topY + R}` +
      ` L ${ex} ${ey}`;
    for (const p of [outline, body, core, shine]) p.setAttribute('d', d);
    shadow.setAttribute('d', d);
    shadow.setAttribute('transform', 'translate(3 5)');
    collarA.setAttribute('x', sx - 19);  collarA.setAttribute('y', sy - 7);
    /* hopper rim lip: pokes ~7px above the box edge, rest hides behind it */
    const scale = mc.width / 600;
    const crownW = 166 * scale;
    const crownY = mc.top - wb.top - 7;
    crown.setAttribute('x', ex - crownW / 2);   crown.setAttribute('y', crownY);
    crown.setAttribute('width', crownW);
    crownHi.setAttribute('x', ex - crownW / 2 + 9); crownHi.setAttribute('y', crownY + 3);
    crownHi.setAttribute('width', crownW * 0.5);
    /* one gold union halfway up the gutter rise */
    fittings.innerHTML = '';
    fittings.appendChild(mk('rect', {
      fill: '#C8A84B', stroke: '#5A3A1A', 'stroke-width': 2, rx: 3,
      x: gutterX - 17, y: (dip + topY) / 2 - 7, width: 34, height: 14
    }));
    len = body.getTotalLength();
    ready = true;
  }

  const queue = [];
  let busy = false;
  function pump() {
    if (busy || !queue.length) return;
    const entry = queue.shift();
    if (!files.some(f => f.id === entry.id)) { pump(); return; }
    if (!ready) { machine.feed(entry); setTimeout(pump, 60); return; }
    busy = true;
    /* a little paper parcel tumbles down the pipe */
    const pkg = mk('g', {});
    pkg.append(
      mk('rect', { x: -8, y: -10, width: 16, height: 20, fill: '#FFFFFF', stroke: '#5A3A1A', 'stroke-width': 2, rx: 2 }),
      mk('rect', { x: -4.5, y: -5, width: 9, height: 2.5, fill: entry.color }),
      mk('rect', { x: -4.5, y: -0.5, width: 9, height: 2.5, fill: '#D9CBAA' })
    );
    svg.appendChild(pkg);
    /* travel time is CONSTANT no matter how long tonight's pipe is —
       the parcel simply moves faster through longer plumbing */
    const t0 = performance.now(), DUR = 900;
    (function step(now) {
      const k = Math.min((now - t0) / DUR, 1);
      const e = k * k * (3 - 2 * k);
      const pt = body.getPointAtLength(e * len);
      pkg.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${e * 300}) scale(${1 - e * 0.3})`);
      if (k < 1) requestAnimationFrame(step);
      else {
        pkg.remove();
        /* short beat while it travels the in-canvas corner pipe */
        setTimeout(() => { if (files.some(f => f.id === entry.id)) machine.feed(entry); }, 260);
        busy = false;
        setTimeout(pump, 200);
      }
    })(performance.now());
  }

  const ro = new ResizeObserver(layout);
  ro.observe(document.body);
  ro.observe(document.querySelector('.side'));   // queue growing/shrinking refits the hook
  requestAnimationFrame(layout);
  return {
    send(entry) { queue.push(entry); pump(); },
    clear() { queue.length = 0; }
  };
})();

/* ═══════════════════════════════════════════════════════════════
   WIRING
   ═══════════════════════════════════════════════════════════════ */
function wireDropTarget(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });
}
wireDropTarget($('dropCard'));
wireDropTarget($('machineCard'));

$('dz').addEventListener('click', () => $('fileInput').click());
$('dz').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click(); }
});
$('fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('pressBtn').addEventListener('click', pressIt);
$('clearBtn').addEventListener('click', clearAll);

renderList();
</script>
<script>
/* ── USAGE REPORTING ─────────────────────────────────────────────────────
   The toolbox-wide counters are displayed on the launcher home page; this
   page only reports finished work to POST /api/stats (fire-and-forget).
   Test hook: localStorage.ggstats_ep overrides the report URL. */
(function () {
  'use strict';
  window.ggStatReport = function (tool, n) {
    try {
      var ep = localStorage.getItem('ggstats_ep') ||
        (location.protocol.indexOf('http') === 0 ? location.origin + '/api/stats' : '');
      if (!ep || !(n > 0)) return;
      fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tool: tool, n: n }), keepalive: true }).catch(function () {});
    } catch (e) { /* stats are best-effort */ }
  };
})();
</script>

<script>
/* Envelope button: click/tap shows the contact tooltip (hover covers desktop). */
(function () {
  var wrap = document.querySelector('.brand-email-wrap');
  if (!wrap) return;
  var btn = wrap.querySelector('.brand-email-btn');
  var t;
  btn.addEventListener('click', function () {
    wrap.classList.toggle('open');
    clearTimeout(t);
    if (wrap.classList.contains('open')) {
      t = setTimeout(function () { wrap.classList.remove('open'); }, 4000);
    }
  });
  document.addEventListener('click', function (e) {
    if (!wrap.contains(e.target)) wrap.classList.remove('open');
  });
})();
</script>
